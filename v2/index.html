<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1226">
<title>FleetWatch</title>
<meta name="description" content="Tablero de monitoreo de flota: viajes, tiempos y seguridad.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="FleetWatch">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F1226'/%3E%3Cpath d='M5 17h6l3-8 4 15 3-10 2 3h4' fill='none' stroke='%23F28C28' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0F1226;
    --panel: #181C3A;
    --line: #3E4580;
    --ink: #EEF0FA;
    --muted: #A3AAD6;
    --accent: #F28C28;
    --hh: 52px;          /* alto de la cabecera */
    --pad: 12px;         /* margen alrededor del tablero */
    --tabbar: 60px;      /* alto de la barra de Power BI que se recorta abajo */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", "Segoe UI", system-ui, sans-serif;
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }

  /* Cabecera */
  .bar {
    height: calc(var(--hh) + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) 20px 0;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .brand h1 {
    margin: 0;
    font-family: "Barlow Semi Condensed", "Barlow", sans-serif;
    font-weight: 600;
    font-size: 1.35rem;
    letter-spacing: .01em;
    display: flex; align-items: center; gap: 10px;
  }
  .brand h1::before {
    content: "";
    width: 4px; height: 1.1em;
    background: var(--accent);
    border-radius: 2px;
  }
  .brand p {
    margin: 0;
    color: var(--muted);
    font-size: .9rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    appearance: none;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
    font: 500 .88rem/1 "Barlow", sans-serif;
    text-decoration: none;
    cursor: pointer;
  }
  .btn:hover { background: var(--panel); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .btn[hidden] { display: none; }

  /* Escenario: el tablero siempre se ve completo, sin franjas ni recortes */
  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: var(--pad) 20px;
  }
  .stage {
    /* ancho = el mayor que cabe sin pasar del alto disponible (16:9 + barra de páginas) */
    --w: min(calc(100vw - 40px), calc((100dvh - var(--hh) - env(safe-area-inset-top, 0px) - 2 * var(--pad)) * 16 / 9));
    width: var(--w);
    height: calc(var(--w) * 9 / 16);
    position: relative;
    background: var(--panel);
    box-shadow: 0 0 0 1px var(--line);
    border-radius: 0;
    overflow: hidden;
  }
  .stage iframe {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: calc(100% + var(--tabbar));   /* la barra queda fuera del recuadro y se recorta */
    border: 0;
  }
  /* Pantalla de carga */
  .loading {
    position: absolute; inset: 0;
    z-index: 2;
    display: grid; place-items: center;
    background: var(--panel);
    transition: opacity .5s ease, visibility .5s ease;
  }
  .loading.done { opacity: 0; visibility: hidden; }
  .ld { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .pulse {
    width: 120px; height: 40px;
    fill: none; stroke: var(--accent);
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .pulse path {
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw 1.9s ease-in-out infinite;
  }
  @keyframes draw {
    0%   { stroke-dashoffset: 1; opacity: 1; }
    60%  { stroke-dashoffset: 0; opacity: 1; }
    85%  { stroke-dashoffset: 0; opacity: 0; }
    100% { stroke-dashoffset: 1; opacity: 0; }
  }
  .ld-name {
    display: flex; align-items: center; gap: 12px;
    font-family: "Barlow Semi Condensed", "Barlow", sans-serif;
    font-weight: 600;
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    letter-spacing: .02em;
    animation: breathe 2.4s ease-in-out infinite;
  }
  .ld-name::before { content: ""; width: 4px; height: 1em; background: var(--accent); }
  @keyframes breathe { 50% { opacity: .6; } }
  .ld-sub { font-size: .85rem; letter-spacing: .06em; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .pulse path { animation: none; stroke-dashoffset: 0; }
    .ld-name { animation: none; }
    .loading { transition: none; }
  }

  .stage:fullscreen {
    width: 100vw; height: 100vh;
    box-shadow: none; border-radius: 0;
  }

  /* Aviso para celular en vertical */
  .rotate {
    display: none;
    margin: 0 0 12px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    font-size: .9rem;
    line-height: 1.35;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .rotate button {
    appearance: none; border: 0; background: transparent;
    color: var(--accent);
    font: 600 .9rem "Barlow", sans-serif;
    cursor: pointer;
    padding: 6px 4px;
  }
  .rotate button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Celular */
  @media (max-width: 700px) {
    :root { --hh: 52px; }
    .bar { padding-left: 14px; padding-right: 14px; }
    .brand p { display: none; }
    .btn span { display: none; }       /* solo iconos */
    .btn { padding: 9px; }
    main { padding: 10px 0 16px; place-items: start center; }
    .stage { box-shadow: none; border-radius: 0; --w: 100vw; }
  }
  @media (max-width: 700px) and (orientation: portrait) {
    .rotate { display: flex; margin-left: 14px; margin-right: 14px; }
    main { display: block; }
    .stage { margin-top: 0; }
  }

  /* Celular en horizontal: usa todo el alto */
  @media (max-height: 480px) and (orientation: landscape) {
    :root { --hh: 44px; }
    .bar { padding-left: 14px; padding-right: 14px; }
    .brand p { display: none; }
    main { padding: 8px 0; }
    .stage { border-radius: 0; box-shadow: none;
             --w: min(100vw, calc((100dvh - var(--hh) - env(safe-area-inset-top, 0px) - 16px) * 16 / 9)); }
  }

  /* Cabecera que se oculta sola (computador con mouse) */
  .edge { display: none; }
  @media (hover: hover) and (pointer: fine) and (min-width: 701px) {
    :root { --hh: 0px; --pad: 10px; }
    body { overflow: hidden; }
    .edge {
      display: block;
      position: fixed; top: 0; left: 0; right: 0;
      height: 14px;
      z-index: 10;
    }
    .edge::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
    }
    .edge span {
      position: absolute; top: 3px; left: 50%;
      transform: translateX(-50%);
      width: 38px; height: 14px;
      background: var(--bg);
      color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .edge span svg { width: 12px; height: 12px; }
    .bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 44px;
      padding: 0 16px;
      z-index: 20;
      background: var(--bg);
      transform: translateY(-100%);
      transition: transform .22s ease;
    }
    .edge:hover + .bar,
    .bar:hover,
    .bar:focus-within { transform: translateY(0); }
    main { padding: var(--pad); place-items: center; }
    .stage {
      --w: min(calc(100vw - 20px), calc((100dvh - 20px) * 16 / 9));
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar { transition: none; }
  }
</style>
</head>
<body>

<div class="edge" aria-hidden="true"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div>

<header class="bar">
  <div class="brand">
    <h1>FleetWatch</h1>
    <p>Monitoreo de flota de Transcord</p>
  </div>
  <div class="actions">
    <button class="btn" id="fs" type="button" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      <span>Pantalla completa</span>
    </button>
    <a class="btn" id="open" target="_blank" rel="noopener" aria-label="Abrir en una pestaña nueva"
       href="https://app.powerbi.com/view?r=eyJrIjoiNDdlMGFlZDktMGVkZS00N2Y1LThlNmItNGVlOTM4MjdiNDQ3IiwidCI6ImM0YTY2YzM0LTJiYjctNDUxZi04YmUxLWIyYzI2YTQzMDE1OCIsImMiOjR9">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
      <span>Abrir aparte</span>
    </a>
  </div>
</header>

<main>
  <div class="rotate" id="rotate" role="note">
    <span>Gira el celular para ver el tablero completo.</span>
    <button type="button" id="rotate-close">Entendido</button>
  </div>

  <div class="stage" id="stage">
    <div class="loading" id="loading" role="status" aria-live="polite">
      <div class="ld">
        <svg class="pulse" viewBox="0 0 120 40" aria-hidden="true"><path pathLength="1" d="M2 24h28l8-16 10 28 8-20 5 8h57"/></svg>
        <div class="ld-name">FleetWatch</div>
        <div class="ld-sub">Cargando tablero</div>
      </div>
    </div>
    <iframe
      title="FleetWatch"
      src="https://app.powerbi.com/view?r=eyJrIjoiNDdlMGFlZDktMGVkZS00N2Y1LThlNmItNGVlOTM4MjdiNDQ3IiwidCI6ImM0YTY2YzM0LTJiYjctNDUxZi04YmUxLWIyYzI2YTQzMDE1OCIsImMiOjR9"
      allowfullscreen="true"
      frameborder="0"></iframe>
  </div>
</main>

<script>
  var stage = document.getElementById('stage');
  var fs = document.getElementById('fs');

  // Pantalla completa (si el navegador la permite; en iPhone se oculta y queda "Abrir aparte")
  if (!document.fullscreenEnabled) {
    fs.hidden = true;
  } else {
    fs.addEventListener('click', function () {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        stage.requestFullscreen().then(function () {
          try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
        }).catch(function () {});
      }
    });
  }

  // Pantalla de carga: se retira cuando Power BI termina de cargar
  var loading = document.getElementById('loading');
  var frame = document.querySelector('.stage iframe');
  var t0 = Date.now();
  function hideLoading() { loading.classList.add('done'); }
  // Power BI no avisa cuándo termina de dibujar el informe, así que se espera
  // un tiempo extra después de que carga el marco. Ajusta EXTRA (milisegundos).
  var EXTRA = 3500;
  frame.addEventListener('load', function () {
    setTimeout(hideLoading, Math.max(EXTRA, 2500 - (Date.now() - t0)));
  });
  setTimeout(hideLoading, 20000);

  // Cerrar el aviso de girar el celular
  document.getElementById('rotate-close').addEventListener('click', function () {
    document.getElementById('rotate').style.display = 'none';
  });
</script>
</body>
</html>
